        <h3>Завдання 4</h3>
        <form id="main_form4">
            x<input type="text" id="x_task4" value="2"><br>
            y<input type="text" id="y_task4" value="1"><br>
            F<input type="text" id="F_task4" value=""><br>
            <input type="button" onClick="task4();" value="Обчислити">
        </form>
        <script>


            function task4() {
                let x, y, F;
                x = parseInt(main_form4.x_task4.value);
                y = parseInt(main_form4.y_task4.value);
                if (x > 0) F = 3 * x * y;
                else if (x < 0 && y > 1.5) F = 2 * x / y;
                else F = x * x + y * y * y;
                main_form4.F_task4.value = "" + F;
            }
        </script>

        <h3>Завдання 5</h3>

        <form id="main_form5">
            x <input type="text" id="x_task5" value="">
            y <input type="text" id="y_task5" value="">
            result <input type="text" id="result_task5" value=""><br>

            <input type="button" onclick="task5();" value="Обчислити">
        </form>

        <script>
            function task5() {
                let x = parseFloat(main_form5.x_task5.value);
                let y = parseFloat(main_form5.y_task5.value);

                let result = 0;

                for (let i = 3; i <= 5; i++) {

                    let factorial = 1;

                    for (let j = 1; j <= i; j++) {
                        factorial *= j;
                    }

                    let calc = (-1) ** i * ((2 * x * y - x * x) / (i + 2)) * factorial;

                    result += calc;
                }

                main_form5.result_task5.value = "" + result.toFixed(3);
            }
        </script>
