<body onLoad="clock()">
   <form name="clock">
        Час+дата:
        <input type="text" name="time" size="30" value="">
    </form>
    <script Language="JavaScript">
        let timeStr, dateStr;

        function clock() {
            now = new Date();
            hours = now.getHours();
            minutes = now.getMinutes();
            seconds = now.getSeconds();

            timeStr = "" + hours;
            timeStr += ((minutes < 10) ? "/0" : "/") + minutes;
            timeStr += ((seconds < 10) ? "/0" : "/") + seconds;

            date = now.getDate();
            month = now.getMonth() + 1;
            year = now.getFullYear();

            dateStr = "+" + year;
            dateStr += ((month < 10) ? "*0" : "*") + month;
            dateStr += ((date < 10) ? "*0" : "*") + date;

            document.clock.time.value = timeStr + dateStr;

            Timer = setTimeout("clock()", 1000);
        }
    </script>

    <div class="calculator">
        <input type="text" class="display" id="display" value="0" readonly>

        <div class="buttons">
            <button onclick="displayNumber(7)">7</button>
            <button onclick="displayNumber(8)">8</button>
            <button onclick="displayNumber(9)">9</button>
            <button onclick="displayOperator('+')">+</button>

            <button onclick="displayNumber(4)">4</button>
            <button onclick="displayNumber(5)">5</button>
            <button onclick="displayNumber(6)">6</button>
            <button onclick="displayOperator('-')">-</button>

            <button onclick="displayNumber(1)">1</button>
            <button onclick="displayNumber(2)">2</button>
            <button onclick="displayNumber(3)">3</button>
            <button onclick="displayOperator('*')">*</button>

            <button onclick="clearDisplay()">C</button>
            <button onclick="displayNumber(0)">0</button>
            <button onclick="calculate()">=</button>
            <button onclick="displayOperator('/')">/</button>
        </div>
    </div>
    <script>
        let display = document.getElementById("display");
        let resultDisplayed = false;
        let operatorDisplayed = false;
        function displayNumber(number) {
            if (resultDisplayed) {
                clearDisplay();
            }
            if (display.value === "0") {
                display.value = number;
            } else if (display.value.endsWith(" 0")) {
                display.value = display.value.slice(0, -1) + number;
            } else {
                display.value += number;
            }
        }

        function displayOperator(op) {
            if (!operatorDisplayed) {
                display.value += " " + op + " ";
                operatorDisplayed = true;
                resultDisplayed = false;
            }
        }

        function clearDisplay() {
            display.value = "0";
            resultDisplayed = false;
            operatorDisplayed = false;
        }

        function calculate() {
            if (!operatorDisplayed || display.value.endsWith(" ")) {
                return;
            }

            display.value = eval(display.value);
            resultDisplayed = true;
            operatorDisplayed = false;
        }
    </script>
